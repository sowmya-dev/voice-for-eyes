server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;

    # Everything is served by this app; the page may not load or send anything elsewhere.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    # Cross-origin isolation lets OCR use several CPU threads. Every file is served by this app.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Referrer-Policy no-referrer always;

    # nginx does not know the .mjs type, and module scripts need it.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
    }

    # The backend name is resolved per request, so the page still loads if the backend is not up yet.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_read_timeout 90s;
        client_max_body_size 6m;
    }

    location /ws/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # The backend compares the browser's Origin with this Host.
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
